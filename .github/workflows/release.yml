name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: codegraph233-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: codegraph233-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: codegraph233-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/codegraph233"
          test -f "$bin"
          mkdir -p dist
          cp "$bin" dist/codegraph233
          cp README.md CHANGELOG.md dist/
          tar -czf "${{ matrix.archive }}" -C dist codegraph233 README.md CHANGELOG.md
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/codegraph233.exe"
          if (!(Test-Path $bin)) { throw "missing $bin" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $bin dist/codegraph233.exe
          Copy-Item README.md, CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}" -Force
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
