[package]
name = "codegraph233"
version = "0.4.1-dev"
edition = "2021"
description = "AST GraphRAG for game projects (Rust implementation)"

[[bin]]
name = "codegraph233"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
calamine = "0.26"
zip = "=2.2.2"
flate2 = "1"
sha2 = "=0.10.9"
cesu8 = "=1.1.0"
tree-sitter = "=0.25.10"
tree-sitter-java = "=0.23.5"
tree-sitter-c = "=0.24.1"
tree-sitter-cpp = "=0.23.4"
tree-sitter-python = "=0.25.0"
tree-sitter-powershell = "=0.26.6"
tree-sitter-gdscript = "=6.1.0"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-swift = "=0.7.4"
tree-sitter-objc = "=3.0.2"
tree-sitter-dart = "=0.3.0"
base64 = "=0.22.1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
