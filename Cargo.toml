[package]
name = "codegraph233"
version = "0.3.1"
edition = "2021"
description = "AST GraphRAG for game projects (Rust implementation)"

[[bin]]
name = "codegraph233"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
calamine = "0.26"
zip = "=2.2.2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
